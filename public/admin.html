<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page" id="loginView">
    <h1>Admin Login</h1>
    <input type="password" id="pw" placeholder="Admin password">
    <div id="loginErr"></div>
    <button id="loginBtn">Log in</button>
  </div>

  <div class="page" id="logsView" style="display: none;">
    <h1>Activity Log</h1>
    <table id="logsTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Item</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="logsBody"></tbody>
    </table>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
