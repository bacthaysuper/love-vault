<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="page" id="loginView">
    <h1>Admin Login</h1>
    <input type="password" id="pw" placeholder="Admin password">
    <div id="loginErr"></div>
    <button id="loginBtn">Log in</button>
  </div>

  <div class="page" id="logsView" style="display: none;">
    <h1>Activity Log</h1>
    <table id="logsTable">
      <thead>
        <tr>
          <th>Time</th>
          <th>Item</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody id="logsBody"></tbody>
    </table>
        <h1 style="margin-top: 48px;">Manage Items</h1>

    <div id="itemsList"></div>

    <h2>Add New Item</h2>
    <form id="addForm">
      <select id="f-category">
        <option value="travel">Travel</option>
        <option value="shopping">Shopping</option>
      </select>
      <select id="f-type">
        <option value="public">Public</option>
        <option value="secret">Secret</option>
      </select>

      <div id="publicFields">
        <input type="text" id="f-name" placeholder="Name">
        <input type="text" id="f-price" placeholder="Price (e.g. 1,000,000₫)">
      </div>

      <div id="secretFields" style="display:none;">
        <input type="text" id="f-question" placeholder="Question">
        <input type="text" id="f-answer" placeholder="Answer">
        <input type="text" id="f-secretName" placeholder="Real name (revealed on correct)">
        <input type="text" id="f-secretPrice" placeholder="Real price">
      </div>

      <button type="submit">Add Item</button>
    </form>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
